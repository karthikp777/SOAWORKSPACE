spring.application.name=APIGateway


eureka.instance.appname=api-gateway-service
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

server.port=8000

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8089
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://localhost:8086
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/order/**




management.endpoints.web.exposure.include=*
management.info.env.enabled=true


info.app.name=Api Gateway Service
info.app.description=api gateway service project
info.app.author=karthik
info.app.version=1.0